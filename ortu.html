<style>
  :root {
    --ink: #3A1620;
    --navy: #64101F;
    --navy2: #45091A;
    --paper: #F7F4EC;
    --cream: #EFE8D8;
    --accent: #C9A24D;
    --accent-dark: #A9863A;
    --accent-light: #FBF8F1;
    --muted: #8A8578;
    --border: #E4DCCB;
    --success: #1a7a4a;
    --success-bg: #e8f5ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
    padding: 1.4rem 1.5rem 1.6rem; position: relative; overflow: hidden;
    border-bottom: 2px solid var(--accent);
  }
  header::before { display: none; }
  header::after { display: none; }
  .header-inner { position: relative; display: flex; align-items: flex-start; gap: 1rem; }
  .header-logo { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; flex-shrink: 0; margin-top: 4px; }
  .header-text {}
  .header-label { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); opacity: 1; font-weight: 600; margin-bottom: 5px; }
  .student-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(24px, 6vw, 36px); font-weight: 600; letter-spacing: .01em; line-height: 1.05; margin-bottom: 6px; color: var(--paper); }
  .header-meta { font-size: 13px; color: var(--paper); opacity: .7; }
  .header-meta span { color: var(--paper); font-weight: 600; opacity: 1; }

  /* Error state */
  .error-wrap { max-width: 400px; margin: 4rem auto; padding: 0 1.5rem; text-align: center; }
  .error-icon { font-size: 48px; margin-bottom: 1rem; }
  .error-wrap h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .error-wrap p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* Loading */
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 1.5rem; gap: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap p { font-size: 14px; color: var(--muted); }

  main { max-width: 680px; margin: 0 auto; padding: 1.75rem 1.25rem 5rem; }

  /* Stats bar */
  .stats-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .stat-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 30px; color: var(--navy); line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }

  /* Latest badge */
  .fam-chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .fam-chip { border:1px solid var(--accent); background:#fff; color:var(--ink); border-radius:999px; padding:7px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .fam-chip.active { background:#4a0d1a; color:#fff; border-color:#4a0d1a; }
  .latest-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-light); color: var(--ink); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 500; margin-bottom: 1.25rem; }

  /* Laporan cards */
  .laporan-card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 1rem; overflow: hidden;
    transition: box-shadow .2s;
  }
  .laporan-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .laporan-card.latest { border-color: var(--accent); border-width: 2px; }

  .laporan-top {
    padding: 1.1rem 1.25rem .9rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; gap: 12px;
  }
  .laporan-top:hover { background: var(--paper); }
  .laporan-date-wrap { display: flex; align-items: center; gap: 10px; }
  .date-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex-shrink: 0; }
  .laporan-card.latest .date-dot { background: var(--accent-dark); }
  .laporan-date { font-size: 14px; font-weight: 500; }
  .new-badge { font-size: 10px; background: var(--accent-light); color: var(--ink); padding: 2px 7px; border-radius: 10px; font-weight: 500; border: 1px solid #b8dfc9; }
  .chevron { color: var(--muted); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
  .laporan-top.open .chevron { transform: rotate(180deg); }

  .laporan-body { display: none; border-top: 1px solid var(--cream); }
  .laporan-body.open { display: block; }

  .laporan-item { padding: 1rem 1.25rem; border-bottom: 1px solid var(--cream); }
  .laporan-item:last-child { border-bottom: none; }
  .item-label { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .item-value { font-size: 14px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; }
  .item-value.empty-val { color: var(--muted); font-style: italic; }

  /* PR highlight */
  .pr-highlight { background: var(--accent-light); border: 1px solid var(--accent); border-radius: 8px; padding: .75rem 1rem; }
  .pr-highlight .item-label { color: var(--ink); }
  .pr-highlight .item-value { color: var(--ink); }

  /* Empty */
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 17px; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
  .empty-state p { font-size: 13px; line-height: 1.6; }

  /* Footer */
  .footer { text-align: center; padding: 2rem 1rem; font-size: 12px; color: var(--muted); }
  .footer strong { color: var(--muted); }

  @media (max-width: 480px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-num { font-size: 24px; }
  }
  .pager { display:flex; align-items:center; justify-content:center; gap:12px; margin:16px 0 4px; }
  .pager button { padding:9px 16px; border-radius:8px; border:1px solid var(--border,#e2ddd5); background:#fff; cursor:pointer; font-size:13px; color:var(--ink,#2d3748); font-family:inherit; }
  .pager button:disabled { opacity:.4; cursor:not-allowed; }
  .pager span { font-size:12px; color:var(--muted,#718096); font-weight:500; }

function slugify(s) { return String(s).toLowerCase().trim().replace(/\s+/g, '-'); }

function parseDate(dateStr) {
  if (!dateStr) return new Date();
  // Handle both '2026-05-04' and '2026-05-04T17:00:00.000Z'
  const iso = typeof dateStr === 'string' ? dateStr.slice(0, 10) : new Date(dateStr).toISOString().slice(0, 10);
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatTgl(dateStr) {
  const d = parseDate(dateStr);
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function formatTglShort(dateStr) {
  const d = parseDate(dateStr);
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function isToday(dateStr) {
  const today = new Date().toISOString().split('T')[0];
  return dateStr === today;
}

function isThisWeek(dateStr) {
  const now = new Date();
  const d = parseDate(dateStr);
  const diff = (now - d) / (1000 * 60 * 60 * 24);
  return diff <= 7;
}

function val(str) { return str && str.trim() ? str.trim() : null; }

function renderItem(icon, label, content, highlight = false) {
  const v = val(content);
  return `
    <div class="laporan-item${highlight ? ' pr-highlight' : ''}">
      <div class="item-label"><span>${icon}</span> ${label}</div>
      <div class="item-value${!v ? ' empty-val' : ''}">${v || tr('nonote')}</div>
    </div>
  `;
}

let ortuSorted = [];
let ortuPage = 1;
const ORTU_PER = 5;

function renderOrtuLaporan() {
  const cont = document.getElementById('laporan-container');
  if (!cont) return;
  const total = ortuSorted.length;
  if (!total) {
    cont.innerHTML = `<div class="empty-state"><div class="icon">🎹</div><h3>${tr('none_t')}</h3><p>${tr('none_s')}</p></div>`;
    return;
  }
  const pages = Math.ceil(total / ORTU_PER);
  if (ortuPage > pages) ortuPage = pages;
  if (ortuPage < 1) ortuPage = 1;
  const startI = (ortuPage - 1) * ORTU_PER;
  const items = ortuSorted.slice(startI, startI + ORTU_PER);
  const cards = items.map((l, i) => {
    const gi = startI + i;
    const isLatest = gi === 0;
    const isNew = isThisWeek(l.tanggal);
    return `
      <div class="laporan-card${isLatest ? ' latest' : ''}">
        <div class="laporan-top${isLatest ? ' open' : ''}" onclick="toggleCard(this)">
          <div class="laporan-date-wrap">
            <div class="date-dot"></div>
            <div class="laporan-date">${formatTglShort(l.tanggal)}</div>
            ${isNew ? '<span class="new-badge">'+tr('baru')+'</span>' : ''}
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="laporan-body${isLatest ? ' open' : ''}">
          ${renderItem('🎹', tr('materi'), l.materi)}
        </div>
      </div>
    `;
  }).join('');
  const nav = pages > 1
    ? `<div class="pager">
         <button ${ortuPage <= 1 ? 'disabled' : ''} onclick="ortuGoto(-1)">${tr('prev')}</button>
         <span>${tr('hal')} ${ortuPage} / ${pages}</span>
         <button ${ortuPage >= pages ? 'disabled' : ''} onclick="ortuGoto(1)">${tr('next')}</button>
       </div>`
    : '';
  cont.innerHTML = cards + nav;
}

function ortuGoto(d) {
  ortuPage += d;
  renderOrtuLaporan();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Keluarga / grup: satu link bisa lihat laporan semua anggota grup ──
let ORTU_FAM = [];
async function loadFamily(murid, laporan) {
  ORTU_FAM = [{ murid: murid, laporan: laporan }];
  try {
    const t = await sb.from('tarif').select('grup').ilike('nama', String(murid.nama).trim()).limit(1);
    const grup = t.data && t.data[0] && String(t.data[0].grup || '').trim();
    if (!grup) return;
    const g = await sb.from('tarif').select('nama').eq('grup', grup);
    const names = (g.data || []).map(function (x) { return String(x.nama).trim().toLowerCase(); });
    const all = await sb.from('murid').select('*');
    const others = (all.data || []).filter(function (m) { return m.id !== murid.id && names.indexOf(String(m.nama).trim().toLowerCase()) >= 0; });
    if (!others.length) return;
    const ids = others.map(function (m) { return m.id; });
    const lr = await sb.from('laporan').select('*').in('murid_id', ids);
    others.sort(function (a, b) { return String(a.nama).localeCompare(String(b.nama)); }).forEach(function (m) {
      ORTU_FAM.push({ murid: m, laporan: (lr.data || []).filter(function (l) { return l.murid_id === m.id; }) });
    });
  } catch (e) {}
}
function famChipsHTML() {
  if (ORTU_FAM.length < 2) return '';
  return '<div class="fam-chips" id="fam-chips">' + ORTU_FAM.map(function (f, i) {
    return '<button class="fam-chip' + (i === 0 ? ' active' : '') + '" onclick="pilihAnak(' + i + ')">' + f.murid.nama + '</button>';
  }).join('') + '</div>';
}

  renderOrtuLaporan();
}

ortuSorted = sorted;

let ortuInvs = [];

const DURASI_MAP = { logan:45, charlotte:45, george:45, adrianna:30, ayori:30, farrel:30, wilda:30, atta:30, arsya:30, dylan:30, gavin:30, louis:30, windi:30, mika:30 };
function durOf(nama) { const k = String(nama).trim().toLowerCase(); return DUR_DB[k] || DURASI_MAP[k] || 60; }

function invoiceDocHTML(inv) {
  const items = inv.items || [];
  let lesCount = 0;
  const rows = items.map(function (it) {
    const label = it.label || ''; const qty = Number(it.qty) || 0; const rate = Number(it.rate) || 0; const amt = (it.amount != null ? Number(it.amount) : qty * rate);
    let nama, dur, biaya, jml;
    if (/Les$/.test(label)) { nama = label.indexOf(' — ') >= 0 ? label.split(' — ')[0] : inv.target; dur = durOf(nama); biaya = fmtRpO(rate); jml = qty; lesCount += qty; }
    else if (/Transport$/.test(label)) { const np = label.indexOf(' — ') >= 0 ? label.split(' — ')[0] : ''; nama = 'Transport' + (np ? ' (' + np + ')' : ''); dur = '—'; biaya = fmtRpO(rate); jml = qty; }
    else if (/Schedule Fee$/.test(label)) { const np = label.indexOf(' — ') >= 0 ? label.split(' — ')[0] : ''; nama = 'Schedule Fee' + (np ? ' (' + np + ')' : ''); dur = '—'; biaya = fmtRpO(rate); jml = qty; }
    else { nama = label; dur = '—'; biaya = ''; jml = ''; }
    return '<tr><td style="padding:9px 10px;border-bottom:1px solid #eee">' + nama + '</td><td style="padding:9px 10px;border-bottom:1px solid #eee;text-align:center">' + dur + '</td><td style="padding:9px 10px;border-bottom:1px solid #eee;text-align:right">' + biaya + '</td><td style="padding:9px 10px;border-bottom:1px solid #eee;text-align:center">' + jml + '</td><td style="padding:9px 10px;border-bottom:1px solid #eee;text-align:right">' + fmtRpO(amt) + '</td></tr>';
  }).join('');
  return '<div style="max-width:640px;margin:0 auto;font-family:sans-serif;color:#2b0714;background:#fff;padding:4px">'
    + '<div style="text-align:center;border-bottom:3px solid #C9A24D;padding-bottom:14px;margin-bottom:16px">'
    + '<div style="font-family:Georgia,serif;font-size:20px;font-weight:700;letter-spacing:.02em;color:#4a0d1a">STANLEY PRIVATE PIANO COURSE</div>'
    + '<div style="font-size:19px;font-weight:700;margin-top:10px">' + (inv.target || '') + '</div>'
    + '<div style="font-size:12px;color:#888;letter-spacing:.05em;margin-top:2px">INVOICE · ' + labelBulanOrtu(inv.bulan) + '</div></div>'
    + '<div style="text-align:center;font-size:10.5px;color:#999;letter-spacing:.08em">' + tr('kode') + '</div>'
    + '<div style="text-align:center;font-size:15px;font-weight:700;color:#4a0d1a;margin-bottom:16px">' + (inv.kode || '-') + '</div>'
    + '<div style="display:flex;gap:12px;margin-bottom:18px">'
    +   '<div style="flex:1;background:#faf4ea;border:1px solid #ecd9b0;border-radius:12px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:#4a0d1a">' + lesCount + '</div><div style="font-size:10px;letter-spacing:.06em;color:#998;text-transform:uppercase">' + tr('sesi') + '</div></div>'
    +   '<div style="flex:1;background:#faf4ea;border:1px solid #ecd9b0;border-radius:12px;padding:14px;text-align:center"><div style="font-size:17px;font-weight:800;color:#4a0d1a">' + fmtRpO(inv.total) + '</div><div style="font-size:10px;letter-spacing:.06em;color:#998;text-transform:uppercase">' + tr('totaltag') + '</div></div>'
    + '</div>'
    + '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px"><table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:440px"><thead><tr style="background:#4a0d1a;color:#fff"><th style="padding:9px 10px;text-align:left">' + tr('h_nama') + '</th><th style="padding:9px 10px;text-align:center">' + tr('h_durasi') + '</th><th style="padding:9px 10px;text-align:right">' + tr('h_biaya') + '</th><th style="padding:9px 10px;text-align:center">' + tr('h_jumlah') + '</th><th style="padding:9px 10px;text-align:right">' + tr('h_total') + '</th></tr></thead><tbody>'
    + rows
    + '<tr style="background:#faf4ea;font-weight:800"><td style="padding:11px 10px" colspan="4">' + tr('grand') + '</td><td style="padding:11px 10px;text-align:right;color:#4a0d1a">' + fmtRpO(inv.total) + '</td></tr>'
    + '</tbody></table></div>'
    + '<div style="background:#faf4ea;border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.7">'
    +   '<div style="font-weight:700;color:#4a0d1a;letter-spacing:.05em;margin-bottom:6px">' + tr('payinfo') + '</div>'
    +   tr('transfer') + ' <strong>' + CFG.bank_nama + ' ' + CFG.bank_rekening + '</strong> a/n ' + CFG.bank_atas_nama + '<br>'
    +   tr('berita') + '<br>'
    +   tr('kirim') + ' <strong>' + CFG.wa_bayar + '</strong><br>'
    +   tr('batas1') + ' ' + CFG.batas_tgl + ' ' + tr('batas2')
    + '</div>'
    + '<div style="text-align:center;font-size:11px;color:#aaa;margin-top:14px">' + tr('thanks') + '</div>'
    + '</div>';
}

function showOrtuTab(name) {
  var L = document.getElementById('tab-laporan'), B = document.getElementById('tab-bayar');
  if (L) L.style.display = name === 'laporan' ? '' : 'none';
  if (B) B.style.display = name === 'bayar' ? '' : 'none';
  var a = document.getElementById('ot-laporan'), b = document.getElementById('ot-bayar');
  if (a) a.classList.toggle('active', name === 'laporan');
  if (b) b.classList.toggle('active', name === 'bayar');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupOrtuTabs() {
  const bar = document.getElementById('ortu-tabs'); if (!bar) return;
  const hasLap = ortuSorted.length > 0 || ORTU_FAM.length > 1;
  const hasBay = ortuInvs.length > 0;
  const tL = document.getElementById('ot-laporan'), tB = document.getElementById('ot-bayar');
  if (tL) tL.style.display = hasLap ? '' : 'none';
  if (tB) tB.style.display = hasBay ? '' : 'none';
  bar.style.display = (hasLap && hasBay) ? '' : 'none';
  if (hasLap) showOrtuTab('laporan');
  else if (hasBay) showOrtuTab('bayar');
  else showOrtuTab('laporan');
}

async function loadOrtuPay(murid) {
  const el = document.getElementById('pay-container'); if (!el) return;
  let target = murid.nama;
  try { const t = await sb.from('tarif').select('grup').eq('nama', murid.nama).limit(1); if (t.data && t.data[0] && t.data[0].grup && String(t.data[0].grup).trim()) target = String(t.data[0].grup).trim(); } catch (e) {}
  let invs = [];
  try { invs = (await sb.from('invoice').select('id,kode,bulan,total,lunas,bukti_url,items,target').eq('target', target).order('bulan', { ascending: false })).data || []; } catch (e) { el.innerHTML = ''; ortuInvs = []; setupOrtuTabs(); return; }
  invs = invs.slice(0, 1); // hanya tampilkan invoice bulan terbaru
  ortuInvs = invs;
  if (!invs.length) { el.innerHTML = ''; setupOrtuTabs(); return; }
  const tsafe = String(target).replace(/'/g, "\\'");
  el.innerHTML = invs.map(function (iv, idx) {
    let action;
    if (iv.lunas) action = '<div class="pay-ok">' + tr('paid') + (iv.bukti_url ? ' · <a href="' + iv.bukti_url + '" target="_blank">' + tr('view') + '</a>' : '') + '</div>';
    else action = '';
    const drop = iv.lunas ? '' : '<label class="pay-drop"><input type="file" accept="image/*" style="display:none" onchange="uploadBukti(' + iv.id + ',\'' + tsafe + '\',\'' + iv.bulan + '\',this)"><div class="pd-ic">📤</div><span>' + (LANG === 'en' ? 'Upload payment proof here' : 'Upload bukti transfer di sini') + '</span><small>' + (LANG === 'en' ? 'Tap to choose a photo / screenshot of your transfer' : 'Ketuk untuk pilih foto / screenshot bukti transfer') + '</small></label>';
    return '<div class="inv-doc-card"><div class="inv-doc">' + invoiceDocHTML(iv) + '</div>' + drop + '<div class="pay-actions"><button class="pay-print" onclick="cetakOrtuInvoice(' + idx + ')">' + tr('print') + '</button>' + action + '</div></div>';
  }).join('');
  setupOrtuTabs();
}

function cetakOrtuInvoice(idx) {
  const iv = ortuInvs[idx]; if (!iv) return;
  document.getElementById('ortu-print').innerHTML = invoiceDocHTML(iv);
  window.print();
}

async function uploadBukti(id, target, bulan, input) {
  const file = input.files && input.files[0]; if (!file) return;
  const span = input.parentElement.querySelector('span'); const old = span.textContent; span.textContent = tr('uploading');
  try {
    let ext = (String(file.name).split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, ''); if (!ext) ext = 'jpg';
    const path = String(target).replace(/[^a-zA-Z0-9-_]/g, '_') + '/' + bulan + '-' + Date.now() + '.' + ext;
    const up = await sb.storage.from('bukti').upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
    if (up.error) throw new Error(up.error.message);
    const url = sb.storage.from('bukti').getPublicUrl(path).data.publicUrl;
    const res = await sb.from('invoice').update({ lunas: true, bukti_url: url, bukti_at: new Date().toISOString() }).eq('id', id);
    if (res.error) throw new Error(res.error.message);
    alert(tr('sent'));
    location.reload();
  } catch (e) { span.textContent = old; alert(tr('ufail') + e.message); }
}

function fmtRpO(n) { return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID'); }
function labelBulanOrtu(ym) { if (!ym) return ''; const MID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; const MEN = ['January','February','March','April','May','June','July','August','September','October','November','December']; const M = LANG === 'en' ? MEN : MID; return (M[parseInt(String(ym).slice(5, 7), 10) - 1] || '') + ' ' + String(ym).slice(0, 4); }

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="error-wrap">
      <div class="error-icon">🔒</div>
      <h2>${tr('errtitle')}</h2>
      <p>${msg}</p>
    </div>
  `;
}

function toggleCard(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

async function init() {
  try { document.getElementById('lang-toggle').textContent = LANG === 'id' ? 'EN' : 'ID'; } catch (e) {}
  await loadConfigOrtu();
  // Support both:
  // /murid/george  (new clean URL via Netlify redirect)
  // /ortu.html?id=xxx  (legacy fallback)
  const path = location.pathname;
  const parts = path.split('/').filter(Boolean); // ['murid', '<link_id>']
  const pathId = (parts[0] === 'murid' && parts[1]) ? parts[1] : null;
  const params = new URLSearchParams(location.search);
  const linkId = params.get('id') || pathId;

  if (!linkId) {
    renderError(tr('err1'));
    return;
  }

  try {
    const res = await sb.from('murid').select('*').eq('link_id', linkId).limit(1);
    if (res.error) throw new Error(res.error.message);
    const murid = res.data && res.data[0];
    if (!murid) throw new Error('Murid tidak ditemukan');
    ORTU_LINK = linkId;
    var _pref = null; try { _pref = localStorage.getItem('ortu_lang_' + linkId); } catch (e) {}
    LANG = _pref ? _pref : ((murid.bahasa === 'en') ? 'en' : 'id');
    try { document.getElementById('lang-toggle').textContent = LANG === 'id' ? 'EN' : 'ID'; } catch (e) {}
    const lr = await sb.from('laporan').select('*').eq('murid_id', murid.id);
    if (lr.error) throw new Error(lr.error.message);
    await loadFamily(murid, lr.data || []);
    renderPage(murid, lr.data || []);
  } catch(e) {
    renderError(tr('err2'));
  }
}

init();
</script>
<div id="ortu-print"></div>
</body>
</html>
